<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Signatures Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.05rem;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            color: #555;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 15px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #777;
            position: relative;
            font-size: 0.9rem;
        }

        .signup-section {
            text-align: center;
            padding: 25px 30px;
            background: #f8f9ff;
            border-top: 1px solid #e0e0e0;
        }

        .signup-section p {
            color: #555;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .btn-outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .form-container {
                padding: 30px 20px;
            }

            .signup-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧</h1>
            <h1>Bem-vindo de Volta!</h1>
            <p>Faça login para continuar</p>
        </div>

        <div class="form-container">
            <div id="alerts"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="seu@email.com" 
                        required
                        autocomplete="email"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Lembrar-me</label>
                    </div>
                    <a href="#" class="forgot-password" onclick="event.preventDefault(); alert('Funcionalidade em desenvolvimento')">
                        Esqueceu a senha?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="submitText">🚀 Entrar</span>
                    <span id="submitLoading" class="loading" style="display: none;"></span>
                </button>
            </form>
        </div>

        <div class="signup-section">
            <p>Não tem uma conta?</p>
            <button class="btn btn-outline" onclick="window.location.href='cadastro_completo.html'">
                ✨ Criar Conta Gratuita
            </button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO
        // API_BASE vazio -> chamadas relativas (mesmo domínio)
        const API_BASE = '';

        // Se seu backend usa cookie de sessão (Set-Cookie), altere para true.
        // Quando true, o fetch fará requests com credentials: 'include'.
        const USE_CREDENTIALS = false;

        // Mostrar alertas
        function showAlert(message, type = 'error') {
            const alertsDiv = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                ${type === 'error' ? '❌' : '✅'}
                <span>${message}</span>
            `;
            alertsDiv.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // Helpers de storage
        function saveTokensToStorage(accessToken, refreshToken, remember) {
            if (remember) {
                if (accessToken) localStorage.setItem('access_token', accessToken);
                if (refreshToken) localStorage.setItem('refresh_token', refreshToken);
            } else {
                if (accessToken) sessionStorage.setItem('access_token', accessToken);
                if (refreshToken) sessionStorage.setItem('refresh_token', refreshToken);
            }
        }
        function getStoredAccessToken() {
            return localStorage.getItem('access_token') || sessionStorage.getItem('access_token') || null;
        }
        function clearStoredTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            sessionStorage.removeItem('access_token');
            sessionStorage.removeItem('refresh_token');
        }

        // Checa /api/v1/auth/me e, se OK, redireciona
        async function checkMeAndRedirect(redirectUrl = 'preview_assinatura_premium.html') {
            try {
                const token = getStoredAccessToken();
                const opts = { method: 'GET', headers: {} };

                if (USE_CREDENTIALS) {
                    opts.credentials = 'include';
                } else if (token) {
                    opts.headers['Authorization'] = `Bearer ${token}`;
                }

                console.log('Checando /api/v1/auth/me com options:', opts, 'token presente?', !!token);
                const res = await fetch(`${API_BASE}/api/v1/auth/me`, opts);
                console.log('/api/v1/auth/me status:', res.status);
                if (res.ok) {
                    console.log('Sessão válida — redirecionando para', redirectUrl);
                    window.location.href = redirectUrl;
                    return true;
                } else {
                    console.warn('/api/v1/auth/me retornou não-ok. Limpando tokens.');
                    clearStoredTokens();
                    return false;
                }
            } catch (err) {
                console.error('Erro ao checar /api/v1/auth/me:', err);
                clearStoredTokens();
                return false;
            }
        }

        // FUNÇÃO DE LOGIN
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            document.getElementById('alerts').innerHTML = '';

            if (!email || !password) {
                showAlert('Por favor, preencha todos os campos', 'error');
                return;
            }

            // UI loading
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitText').style.display = 'none';
            document.getElementById('submitLoading').style.display = 'inline-block';

            try {
                console.log('Tentando login em:', API_BASE + '/api/v1/auth/login');

                const opts = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                };
                if (USE_CREDENTIALS) opts.credentials = 'include';

                const response = await fetch(`${API_BASE}/api/v1/auth/login`, opts);
                console.log('Response status:', response.status, response.statusText);

                const raw = await response.text();
                let json = null;
                try { json = JSON.parse(raw); } catch (e) { /* não-JSON */ }

                console.log('Response body raw:', raw);
                if (json) console.log('Response body json:', json);

                if (!response.ok) {
                    const msg = (json && (json.detail || json.message || json.error)) || raw || 'E-mail ou senha incorretos';
                    throw new Error(msg);
                }

                // Caso backend retorne tokens via JSON
                if (json && json.access_token) {
                    console.log('Tokens encontrados no JSON. Salvando...');
                    saveTokensToStorage(json.access_token, json.refresh_token || null, remember);

                    console.log('LocalStorage token:', localStorage.getItem('access_token'));
                    console.log('SessionStorage token:', sessionStorage.getItem('access_token'));

                    const ok = await checkMeAndRedirect();
                    if (!ok) showAlert('Login efetuado, mas validação falhou. Verifique o backend.', 'error');
                    return;
                }

                // Caso backend use cookie de sessão (Set-Cookie)
                if (USE_CREDENTIALS) {
                    console.log('Nenhum token JSON — esperando cookie de sessão. Verifique Application -> Cookies.');
                    await new Promise(r => setTimeout(r, 500));
                    const ok = await checkMeAndRedirect();
                    if (!ok) showAlert('Login processado, mas validação da sessão falhou. Verifique cookies e config do backend.', 'error');
                    return;
                }

                // Nenhum token JSON e cookies não habilitados no frontend
                console.warn('Login retornou 200 mas sem token JSON e USE_CREDENTIALS=false.');
                showAlert('Login efetuado, mas não foi retornado token. Verifique o backend.', 'error');

            } catch (error) {
                console.error('Erro no login:', error);
                showAlert(error.message || 'Erro ao conectar com o servidor', 'error');
            } finally {
                // UI revert
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitText').style.display = 'inline';
                document.getElementById('submitLoading').style.display = 'none';
            }
        }

        // Enter no campo senha dispara submit
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').requestSubmit();
            }
        });

        // Ao carregar a página: checar token/cookie e redirecionar se válido
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === 'true') {
                showAlert('Conta criada com sucesso! Faça login para continuar.', 'success');
            }

            const token = getStoredAccessToken();
            if (token || USE_CREDENTIALS) {
                console.log('Token/cookie detectado. Verificando validade...');
                checkMeAndRedirect().then(ok => {
                    if (!ok) console.log('Usuário não autenticado ou token inválido.');
                });
            }
        });
    </script>
</body>
</html>
